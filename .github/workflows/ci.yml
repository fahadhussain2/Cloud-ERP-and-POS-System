# Checks every pull request and every push to staging/main (W0-02, D-063).
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
    branches: [staging, main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [staging, main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Server and edge config (W0-03). shellcheck and Docker come with the runner.
      - name: Check server scripts
        run: shellcheck -x infra/server/*.sh infra/edge/*.sh
      - name: Check edge config
        run: |
          docker compose -f infra/edge/compose.yaml config -q
          docker run --rm -v "$PWD/infra/edge/caddy:/etc/caddy:ro" caddy:2.11.7-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  integration:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database inside the CI runner, not a secret.
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
