# Checks every pull request and every push to staging/main (W0-02, D-063).
# After the checks pass on a push, deploys: staging → staging, main → prod (W0-04, D-075).
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
    branches: [staging, main]
    # `labeled`: adding the deploy:staging label deploys the pull request to staging.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [staging, main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

# Adding any other label starts a run too; it gets its own group and skips every job, so it can
# never cancel a real run.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'deploy:staging' && format('-label-{0}', github.event.label.name) || '' }}
  # A newer push replaces an older pull-request run. A run that may deploy (a push, or a pull request
  # labelled deploy:staging) always finishes, so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'deploy:staging') }}

jobs:
  check:
    name: Format, lint, typecheck, test, build
    if: github.event.action != 'labeled' || github.event.label.name == 'deploy:staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Server and edge config (W0-03). shellcheck and Docker come with the runner.
      - name: Check server scripts
        run: shellcheck -x infra/server/*.sh infra/server/files/bin/erp-deploy infra/edge/*.sh infra/db/*.sh infra/db/bin/erp-db infra/db/bin/erp-tenant infra/observability/*.sh infra/observability/bin/erp-obs
      - name: Check edge and app config
        run: |
          docker compose -f infra/edge/compose.yaml config -q
          docker compose -f infra/observability/compose.yaml config -q
          docker run --rm -v "$PWD/infra/observability:/cfg:ro" grafana/alloy:v1.20.1 fmt /cfg/config.alloy >/dev/null
          for env in prod staging; do
            IMAGE_TAG=check docker compose --env-file "infra/app/$env.env" -f infra/app/compose.yaml config -q
            docker compose --env-file "infra/db/$env.env" -f infra/db/compose.yaml config -q
          done
          python3 -m py_compile infra/db/check_backup_status.py
          docker run --rm -v "$PWD/infra/app/web:/etc/caddy:ro" caddy:2.11.7-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/infra/edge/caddy:/etc/caddy:ro" caddy:2.11.7-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  integration:
    name: Integration tests (PostgreSQL 17)
    if: github.event.action != 'labeled' || github.event.label.name == 'deploy:staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database inside the CI runner, not a secret.
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end flows (Chromium)
    if: github.event.action != 'labeled' || github.event.label.name == 'deploy:staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database inside the CI runner, not a secret.
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      # When a flow fails, its pictures and traces, and the POS look's new or differing screenshots (W2-12), to look at
      # or, for a baseline taken from staging, to commit.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/pos-look.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: [check, integration, e2e]
    # A push to staging/main; adding the deploy:staging label; or a new push to a labelled pull request.
    # Not on `opened`: a PR opened with the label also sends `labeled`, which deploys it once.
    if: >-
      github.event_name == 'push' ||
      (github.event.action == 'labeled' && github.event.label.name == 'deploy:staging') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'deploy:staging'))
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
