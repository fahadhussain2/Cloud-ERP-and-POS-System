# Keeps the SHA-pinned GitHub Actions (W0-02) and the PC runner's image (D-119) up to date. npm updates stay manual for now.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    labels: ['module:devops']
  - package-ecosystem: docker
    directory: /infra/ci-runner
    target-branch: staging
    schedule:
      interval: monthly
    labels: ['module:devops']
