packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

# One version of each shared tool for the whole repo (D-071).
catalog:
  '@eslint/js': ^10.0.1
  '@fastify/cookie': ^11.1.3
  '@fastify/rate-limit': ^11.2.1
  '@fastify/otel': 0.21.2
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/context-async-hooks': 2.12.0
  '@opentelemetry/exporter-metrics-otlp-http': 0.223.0
  '@opentelemetry/exporter-trace-otlp-http': 0.223.0
  '@opentelemetry/instrumentation': 0.223.0
  '@opentelemetry/instrumentation-http': 0.223.0
  '@opentelemetry/instrumentation-pg': 0.75.0
  '@opentelemetry/resources': 2.12.0
  '@opentelemetry/sdk-metrics': 2.12.0
  '@opentelemetry/sdk-node': 0.223.0
  '@opentelemetry/semantic-conventions': 1.43.0
  '@node-rs/argon2': ^2.2.2
  '@playwright/test': 1.64.0
  '@sentry/node': 10.76.2
  '@sentry/react': 10.76.2
  '@sentry/vite-plugin': 5.4.1
  '@sqlite.org/sqlite-wasm': 3.53.4-build2
  '@testing-library/react': ^16.3.3
  '@types/node': ^24.19.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.5
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  fast-check: ^4.10.2
  fastify: ^5.12.7
  globals: ^17.13.0
  i18next: ^26.5.0
  jsdom: ^30.1.3
  pg: ^8.23.1
  pino: ^10.4.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.0
  tsup: ^9.0.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  typescript-eslint: ^8.72.0
  vite: ^8.3.0
  vite-plugin-pwa: 2.0.0
  vitest: ^5.0.5
  workbox-window: 7.4.1
  zod: ^4.6.7

# esbuild (used by tsup and tsx) needs its install script to fetch its binary.
allowBuilds:
  esbuild: true
  # @sentry/cli (browser source-map upload, W0-06) downloads its binary in its install script.
  '@sentry/cli': true
  # protobufjs (OpenTelemetry exporters): its install script only checks versions; not needed.
  protobufjs: false
