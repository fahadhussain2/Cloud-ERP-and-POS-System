packages:
  - apps/*
  - packages/*
  - tools/*

# One version of each shared tool for the whole repo (D-071).
catalog:
  '@eslint/js': ^10.0.1
  '@fastify/cookie': ^11.1.3
  '@fastify/rate-limit': ^11.2.1
  '@node-rs/argon2': ^2.2.2
  '@sentry/node': 10.76.2
  '@sentry/react': 10.76.2
  '@sentry/vite-plugin': 5.4.1
  '@testing-library/react': ^16.3.3
  '@types/node': ^24.19.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.5
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  fast-check: ^4.10.2
  fastify: ^5.12.7
  globals: ^17.13.0
  i18next: ^26.5.0
  jsdom: ^30.1.3
  pg: ^8.23.1
  pino: ^10.4.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.0
  tsup: ^9.0.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  typescript-eslint: ^8.72.0
  vite: ^8.3.0
  vitest: ^5.0.5
  zod: ^4.6.7

# esbuild (used by tsup and tsx) needs its install script to fetch its binary.
allowBuilds:
  esbuild: true
