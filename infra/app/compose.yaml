# One release of the apps for one environment (D-075). Run by erp-deploy on the server:
#   IMAGE_TAG=<tree hash> docker compose -p erp-<env> --env-file <env>.env -f compose.yaml up -d --wait
# Images are loaded locally, never pulled. Secrets come from /srv/erp/<env>/app.env (not in git).

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pull_policy: never
  environment:
    ERP_ENV: ${ERP_ENV}
    # Traces and request metrics go to Alloy on the erp-otel network (infra/observability, D-086).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  # Alloy reads Docker's log files; these labels name the service on every line (D-086).
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
      labels: com.docker.compose.project,com.docker.compose.service
  env_file:
    - path: /srv/erp/${ERP_ENV:?}/app.env
      required: false
    # SENTRY_DSN (sudo erp-obs secrets)
    - path: /srv/erp/observability/app.env
      required: false

services:
  api:
    <<: *hardening
    image: erp-api:${IMAGE_TAG:?}
    networks:
      edge:
        aliases:
          - erp-${ERP_ENV}-api
      db: {}
      otel: {}
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:?}
          cpus: '${API_CPUS:?}'

  worker:
    <<: *hardening
    image: erp-worker:${IMAGE_TAG:?}
    networks:
      - default
      - db
      - otel
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:?}
          cpus: '${WORKER_CPUS:?}'

  web:
    <<: *hardening
    image: erp-web:${IMAGE_TAG:?}
    networks:
      edge:
        aliases:
          - erp-${ERP_ENV}-web
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'

networks:
  edge:
    name: erp-edge
    external: true
  # The environment's database network (infra/db, W0-05): internal, no internet.
  db:
    name: erp-${ERP_ENV}-db
    external: true
  # To Alloy (infra/observability): created by infra/observability/apply.sh, internal.
  otel:
    name: erp-otel
    external: true
