# Shared edge proxy for production and staging (W0-03, D-073).
# Owns ports 80/443 and the TLS certificates. App projects join the erp-edge network (W0-04).
name: erp-edge

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Let's Encrypt production by default; set ACME_CA to the staging CA for test runs.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # A folder, not a single file: a replaced file would stay hidden behind the old mount.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    name: erp-edge

volumes:
  caddy_data:
  caddy_config:
