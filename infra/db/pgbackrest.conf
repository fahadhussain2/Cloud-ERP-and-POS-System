# pgBackRest (W0-05, D-076, D-077). Secrets (S3 keys, cipher passphrase) are NOT here: they live on the server
# in /srv/erp/<env>/db-secrets/pgbackrest.conf, included through PGBACKREST_CONFIG_INCLUDE_PATH.
#
# Sized for Backblaze B2's free daily limits (D-077): one repository, a full backup on the 1st of each month
# and a differential every night.
#   - 12 monthly full backups are kept: restore to the start of any of the last 12 months.
#   - WAL is kept from the previous month's full onward: restore to any moment in the last 30+ days.
[global]
repo1-type=s3
repo1-s3-endpoint=s3.us-east-005.backblazeb2.com
repo1-s3-region=us-east-005
repo1-s3-bucket=zorbix-erp-backups-prod
repo1-path=/pgbackrest/repo1
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=12
repo1-retention-diff=35
repo1-retention-archive-type=full
repo1-retention-archive=2
# Bundle small files into a few large objects: far fewer requests to the storage, so faster backups and
# restores and fewer counted transactions. Block-level incremental backups need bundling.
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=4
start-fast=y
delta=y
log-level-console=info
log-level-file=detail

[erp]
pg1-path=/var/lib/postgresql/data
