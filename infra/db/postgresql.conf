# PostgreSQL settings shared by all environments (W0-05, D-076).
# Memory and archive_mode differ per environment and are passed with -c in compose.yaml.

listen_addresses = '*'          # Only reachable on the private Docker network; no port is published.
max_connections = 100
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# Continuous WAL archiving to the off-site repositories (pgBackRest).
wal_level = replica
archive_command = 'pgbackrest --stanza=erp archive-push %p'
archive_timeout = 300           # Committed changes leave the server within 5 minutes (RPO). Sized for B2's free limits (D-077).
wal_recycle = off               # New WAL files are zero-filled, so a near-empty file compresses to almost nothing.
wal_init_zero = on
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min

# Logging
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
shared_preload_libraries = 'pg_stat_statements'
