# The CI runner on the owner's PC (D-119), started by start.ps1. One runner: a run's three jobs take turns. Three side by
# side ran Docker out of memory and slowed the timed integration tests past their limits (PR #204's first run).
name: erp-ci-runner

x-runner: &runner
  build:
    context: .
    args:
      PNPM_VERSION: ${PNPM_VERSION:-}
  image: erp-ci-runner:local
  restart: unless-stopped
  # The Docker socket belongs to root's group: the runner user joins it to start service containers.
  group_add: ['0']
  environment: &env
    REPO_URL: https://github.com/fahadhussain2/Cloud-ERP-and-POS-System
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}

services:
  erp-pc-1:
    <<: *runner
    environment: { <<: *env, RUNNER_NAME: erp-pc-1 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/ci-runner/erp-pc-1:/srv/ci-runner/erp-pc-1
